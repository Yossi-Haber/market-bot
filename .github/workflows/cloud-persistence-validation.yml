name: Cloud Persistence Offline Validation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: marketbot-cloud-persistence-validation
  cancel-in-progress: false

jobs:
  offline-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      TWELVE_DATA_API_KEY: ""
      OPENAI_API_KEY: ""
      TELEGRAM_BOT_TOKEN: ""
      TELEGRAM_CHAT_ID: ""
      TELEGRAM_CHAT_IDS: ""
      TELEGRAM_RECIPIENT_ID_HMAC_KEY: ""
      FINNHUB_API_KEY: ""
      MARKETAUX_API_TOKEN: ""
      FRED_API_KEY: ""
      FMP_API_KEY: ""
      MARKETBOT_CLOUD_LIVE_ENABLED: "0"
      MARKETBOT_CLOUD_TELEGRAM_ENABLED: "0"

    steps:
      - name: Checkout source without credentials
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python 3.10
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install Hebrew fonts and browser libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes fonts-noto-core fonts-liberation2 fontconfig
          fc-cache --force
          python -m pip install --disable-pip-version-check -r requirements-dev.txt
          python -m playwright install --with-deps chromium
          fc-match -f '%{family} | %{style} | %{file}\n' 'Noto Sans Hebrew'
          fc-match -f '%{family} | %{style} | %{file}\n' 'Liberation Sans'

      - name: Record sanitized runtime inventory
        run: |
          mkdir -p output/cloud_operations
          {
            cat /etc/os-release
            python --version
            python -m pip freeze
            python -m playwright --version
            python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); b=p.chromium.launch(headless=True); print("Chromium=" + b.version); b.close(); p.stop()'
            python -c 'from market_calendar import calendar_version; print("pandas_market_calendars=" + calendar_version())'
            dpkg-query -W -f='${Package}=${Version}\n' fonts-noto-core fonts-liberation2 fontconfig
            fc-match -f '%{family} | %{style} | %{file}\n' 'Noto Sans Hebrew'
            fc-match -f '%{family} | %{style} | %{file}\n' 'Liberation Sans'
          } > output/cloud_operations/runtime_inventory.txt

      - name: Run offline tests
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q -ra -p tests.offline_network_guard 2>&1 | tee output/cloud_operations/pytest_results.txt

      - name: Validate NYSE calendar adapter without state or APIs
        run: python run_daily_cloud.py --calendar-check --market-date 2026-10-13

      - name: Render saved Hebrew V3 fixture offline
        run: python validate_linux_compatibility.py --output-dir output/cloud_operations/visual_fixture

      - name: Write compact sanitized report
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("output/cloud_operations")
          fixture = root / "visual_fixture" / "validation_result.json"
          visual = {}
          result = {}
          if fixture.exists():
              result = json.loads(fixture.read_text(encoding="utf-8"))
              visual = result.get("visual_validation", {})
          pytest_file = root / "pytest_results.txt"
          pytest_summary = "not available"
          if pytest_file.exists():
              pytest_summary = next((line.strip() for line in reversed(pytest_file.read_text(encoding="utf-8").splitlines()) if "passed" in line or "failed" in line), "summary unavailable")
          report = [
              "# Cloud Persistence Offline Validation",
              "",
              "- Provider/API calls: 0 (external sockets blocked in pytest)",
              "- Telegram sends: 0",
              f"- Pytest: {pytest_summary}",
              f"- Poster dimensions: {visual.get('dimensions', 'not generated')}",
              f"- RTL: {visual.get('rtl', 'not generated')}",
              f"- Overflow: {visual.get('overflow', 'not generated')}",
              f"- External visual requests: {visual.get('external_requests', 'not generated')}",
              f"- Local images loaded: {result.get('local_images_loaded', 'not generated')}",
              f"- Chromium: {result.get('runtime', {}).get('browser', {}).get('version', 'not generated')}",
              f"- Visual validation: {visual.get('valid', 'not generated')}",
              "- Review the PNG artifact manually; this workflow does not authorize cloud production.",
          ]
          root.mkdir(parents=True, exist_ok=True)
          (root / "validation_report.md").write_text("\n".join(report) + "\n", encoding="utf-8")
          PY

      - name: Upload compact validation artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cloud-persistence-offline-validation
          retention-days: 3
          if-no-files-found: warn
          path: |
            output/cloud_operations/latest.json
            output/cloud_operations/runtime_inventory.txt
            output/cloud_operations/pytest_results.txt
            output/cloud_operations/validation_report.md
            output/cloud_operations/visual_fixture/daily_report_card_v3.png
            output/cloud_operations/visual_fixture/daily_report_v3_visual_validation.json
            output/cloud_operations/visual_fixture/validation_result.json
